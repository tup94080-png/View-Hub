<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pleasure Hub</title>
  <!-- Load Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary-color: #6366f1;
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 32, 51, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
      --danger: #ef4444;
      --accent-glow: rgba(99, 102, 241, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 30px auto;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    header p { color: var(--text-muted); font-size: 1.05rem; }

    .admin-badge {
      position: absolute;
      top: 0; right: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .admin-badge:hover, .admin-badge.active {
      background: var(--accent-glow);
      color: #a5b4fc;
      border-color: var(--primary-color);
    }

    .controls-container {
      max-width: 1200px;
      margin: 0 auto 24px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: center;
    }

    .filter-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary-color);
      color: #fff;
    }

    .actions-group {
      display: flex; gap: 10px; flex-grow: 1; justify-content: flex-end;
    }

    .search-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      outline: none;
      min-width: 200px;
    }

    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: inline-flex !important; }
    body.is-admin .admin-only-block { display: block !important; }

    .upload-btn {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: white; border: none; padding: 8px 18px;
      border-radius: 20px; font-weight: 600; cursor: pointer;
    }

    .admin-panel {
      max-width: 1200px; margin: 0 auto 24px auto;
      border: 1px solid rgba(99, 102, 241, 0.3);
      background: rgba(15, 23, 42, 0.85);
      border-radius: var(--radius); padding: 20px; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; max-width: 1200px; margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius); overflow: hidden;
      display: flex; flex-direction: column;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .media-wrapper {
      height: 200px; background: rgba(0, 0, 0, 0.4);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    .media-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .media-wrapper iframe { width: 100%; height: 100%; border: none; }

    .file-icon-placeholder { font-size: 3.5rem; opacity: 0.8; }
    .info { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    .file-title { font-size: 0.95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }

    .action-link {
      flex: 1; text-align: center; padding: 8px 12px;
      background: rgba(255,255,255,0.08); color: white; text-decoration: none;
      border-radius: 8px; font-size: 0.8rem; font-weight: 500; transition: background 0.2s;
    }
    .action-link:hover { background: var(--primary-color); }

    .btn-icon {
      background: rgba(255,255,255,0.08); border: none; color: white;
      padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.2); }
    .btn-danger { color: #fca5a5; }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal {
      background: #172033; border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 24px; width: 90%; max-width: 400px;
    }
    .modal h3 { margin-bottom: 12px; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    
    .share-options { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .share-btn {
      display: flex; align-items: center; gap: 10px; padding: 10px;
      border-radius: 8px; background: rgba(255,255,255,0.05); color: white;
      text-decoration: none; cursor: pointer; border: none; font-size: 0.9rem;
    }
    .share-btn:hover { background: rgba(255,255,255,0.1); }

    #loading, #error { text-align: center; margin-top: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <h1>Pleasure Hub</h1>
    <p>Universal Media & File Suite</p>
    <button class="admin-badge" id="adminBadge" onclick="handleAuthClick()">🔒 Sign In with Google</button>
  </header>

  <div class="controls-container">
    <div class="filter-group">
      <button class="filter-btn active" onclick="setCategory('all')">🌐 All</button>
      <button class="filter-btn" onclick="setCategory('image')">🖼️ Images</button>
      <button class="filter-btn" onclick="setCategory('video')">🎥 Videos</button>
      <button class="filter-btn" onclick="setCategory('audio')">🎵 Audio</button>
      <button class="filter-btn" onclick="setCategory('file')">📁 Documents</button>
    </div>

    <div class="actions-group">
      <input type="text" id="searchInput" class="search-input" placeholder="Search files..." oninput="renderGallery()" />
      <button class="upload-btn admin-only" onclick="toggleAdminPanel()">⚙️ Admin Console</button>
    </div>
  </div>

  <div id="adminPanel" class="admin-panel admin-only-block">
    <h4>⚙️ Authenticated Admin Controls</h4>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">You are verified as the Master Admin.</p>
    <input type="file" id="fileInput" onchange="uploadFileWithOAuth()" style="display: none;" />
    <button class="action-link" style="cursor: pointer; display: inline-block; width: auto;" onclick="document.getElementById('fileInput').click()">Choose & Upload File</button>
    <p id="uploadStatus" style="margin-top: 10px; font-size: 0.85rem; color: var(--text-muted);"></p>
  </div>

  <div id="loading">Loading hub content...</div>
  <div id="error"></div>
  <div class="gallery" id="gallery"></div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal">
      <h3>Share File</h3>
      <p id="shareFileName" style="font-size:0.85rem; color: var(--text-muted);"></p>
      <div class="share-options">
        <button class="share-btn" onclick="copyShareLink()">📋 Copy Direct Link</button>
        <a id="whatsappShare" class="share-btn" target="_blank">💬 Share to WhatsApp</a>
        <a id="twitterShare" class="share-btn" target="_blank">🐦 Share to X (Twitter)</a>
      </div>
      <div class="modal-buttons">
        <button class="btn-icon" onclick="closeShareModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const FOLDER_ID = '1IlBDjudHYmo6y-JmYj7-IY9hhADEDxUC';
    const API_KEY = 'AIzaSyDM0_CoUN-DVcE4XWzDn2auPtPt1CQP2L0';
    const CLIENT_ID = '185612219987-bv36avu42dfto4v4pvjn73ph6t6m25jh.apps.googleusercontent.com';
    
    // AUTHORIZED ADMIN EMAILS (Normalized to lower case)
    const AUTHORIZED_ADMINS = ['scinetixapp@gmail.com', '15roman940@gmail.com']; 

    let allFiles = [];
    let currentCategory = 'all';
    let tokenClient;
    let accessToken = null;
    let isAdmin = false;
    let activeShareUrl = '';

    window.onload = function() {
      initGoogleAuth();
      loadGallery();
    };

    function initGoogleAuth() {
      if (typeof google !== 'undefined') {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          // Expanded scopes for user info & drive file actions
          scope: 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email openid',
          callback: async (tokenResponse) => {
            if (tokenResponse && tokenResponse.access_token) {
              accessToken = tokenResponse.access_token;
              await verifyAdminIdentity(accessToken);
            }
          },
        });
      } else {
        setTimeout(initGoogleAuth, 500); // Retry if script tag hasn't loaded yet
      }
    }

    function handleAuthClick() {
      if (accessToken && isAdmin) {
        // Sign Out
        accessToken = null;
        isAdmin = false;
        document.body.classList.remove('is-admin');
        document.getElementById('adminBadge').classList.remove('active');
        document.getElementById('adminBadge').textContent = '🔒 Sign In with Google';
        document.getElementById('adminPanel').style.display = 'none';
        renderGallery();
      } else {
        if (!tokenClient) {
          alert("Google Sign-In is still initializing. Please wait a moment.");
          return;
        }
        // Request Google Login
        tokenClient.requestAccessToken({ prompt: '' });
      }
    }

    async function verifyAdminIdentity(token) {
      document.getElementById('adminBadge').textContent = '⏳ Verifying...';
      
      try {
        // Fetch identity details using the OAuth2 token
        const response = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
          headers: { Authorization: `Bearer ${token}` }
        });
        
        if (!response.ok) throw new Error('Failed to retrieve user profile');
        
        const userInfo = await response.json();
        const userEmail = userInfo.email ? userInfo.email.toLowerCase().trim() : '';

        // Check if the signed in email is inside our authorized admin array
        if (userEmail && AUTHORIZED_ADMINS.includes(userEmail)) {
          enableAdminMode();
        } else {
          alert(`Access Denied! The account (${userEmail}) does not have administrative privileges.`);
          accessToken = null;
          isAdmin = false;
          document.getElementById('adminBadge').textContent = '🔒 Sign In with Google';
        }
      } catch (err) {
        console.error("Verification error:", err);
        alert('Failed to verify user identity: ' + err.message);
        document.getElementById('adminBadge').textContent = '🔒 Sign In with Google';
      }
    }

    function enableAdminMode() {
      isAdmin = true;
      document.body.classList.add('is-admin');
      document.getElementById('adminBadge').classList.add('active');
      document.getElementById('adminBadge').textContent = '🔓 Signed In as Admin';
      renderGallery();
    }

    async function loadGallery() {
      const loadingEl = document.getElementById('loading');
      const query = `'${FOLDER_ID}' in parents and trashed = false`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,webViewLink,size,createdTime)&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        loadingEl.style.display = 'none';
        allFiles = data.files || [];
        renderGallery();
      } catch (err) {
        loadingEl.style.display = 'none';
        document.getElementById('error').textContent = `Error: ${err.message}`;
      }
    }

    function renderGallery() {
      const galleryEl = document.getElementById('gallery');
      const searchTerms = document.getElementById('searchInput').value.toLowerCase();
      galleryEl.innerHTML = '';

      const filtered = allFiles.filter(file => {
        const mime = file.mimeType;
        let matchesCat = currentCategory === 'all' ||
          (currentCategory === 'image' && mime.startsWith('image/')) ||
          (currentCategory === 'video' && mime.startsWith('video/')) ||
          (currentCategory === 'audio' && mime.startsWith('audio/')) ||
          (currentCategory === 'file' && !mime.startsWith('image/') && !mime.startsWith('video/') && !mime.startsWith('audio/'));

        return matchesCat && file.name.toLowerCase().includes(searchTerms);
      });

      filtered.forEach(file => {
        const card = document.createElement('div');
        card.className = 'card';
        const directMediaUrl = `https://lh3.googleusercontent.com/d/${file.id}`;
        const viewLink = file.webViewLink || directMediaUrl;
        
        const formattedSize = file.size ? formatBytes(file.size) : 'N/A';
        const formattedDate = file.createdTime ? new Date(file.createdTime).toLocaleDateString() : '';

        let mediaHTML = `<div class="file-icon-placeholder">📄</div>`;
        if (file.mimeType.startsWith('image/')) {
          mediaHTML = `<img src="${directMediaUrl}" alt="${file.name}" loading="lazy" />`;
        } else if (file.mimeType.startsWith('video/')) {
          mediaHTML = `<iframe src="https://drive.google.com/file/d/${file.id}/preview"></iframe>`;
        } else if (file.mimeType.startsWith('audio/')) {
          mediaHTML = `<div class="file-icon-placeholder">🎵</div>`;
        }

        const deleteButton = isAdmin 
          ? `<button class="btn-icon btn-danger" onclick="deleteFile('${file.id}')" title="Delete File">🗑️</button>`
          : '';

        card.innerHTML = `
          <div class="media-wrapper">${mediaHTML}</div>
          <div class="info">
            <div class="file-title" title="${file.name}">${file.name}</div>
            <div class="file-meta">
              <span>${formattedSize}</span>
              <span>${formattedDate}</span>
            </div>
            <div class="card-actions">
              <a href="${viewLink}" target="_blank" class="action-link">Open</a>
              <button class="btn-icon" onclick="openShareModal('${file.name}', '${viewLink}')" title="Share File">🔗</button>
              ${deleteButton}
            </div>
          </div>
        `;
        galleryEl.appendChild(card);
      });
    }

    function formatBytes(bytes, decimals = 2) {
      if (!+bytes) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderGallery();
    }

    function toggleAdminPanel() {
      const panel = document.getElementById('adminPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function openShareModal(fileName, url) {
      activeShareUrl = url;
      document.getElementById('shareFileName').textContent = fileName;
      document.getElementById('whatsappShare').href = `https://api.whatsapp.com/send?text=${encodeURIComponent('Check out this file: ' + url)}`;
      document.getElementById('twitterShare').href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent('Check out ' + fileName)}`;
      document.getElementById('shareModal').style.display = 'flex';
    }

    function closeShareModal() {
      document.getElementById('shareModal').style.display = 'none';
    }

    function copyShareLink() {
      navigator.clipboard.writeText(activeShareUrl).then(() => {
        alert('Link copied to clipboard!');
      });
    }

    async function uploadFileWithOAuth() {
      if (!isAdmin || !accessToken) return alert('Please sign in as admin first');

      const fileInput = document.getElementById('fileInput');
      const statusEl = document.getElementById('uploadStatus');
      const file = fileInput.files[0];
      if (!file) return;

      statusEl.textContent = 'Uploading securely via Google Auth...';

      const metadata = { name: file.name, parents: [FOLDER_ID] };
      const formData = new FormData();
      formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      formData.append('file', file);

      try {
        const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` },
          body: formData
        });

        const result = await response.json();
        if (result.error) throw new Error(result.error.message);

        statusEl.textContent = 'Upload successful!';
        setTimeout(() => { loadGallery(); }, 1000);
      } catch (err) {
        statusEl.textContent = `Upload error: ${err.message}`;
      }
    }

    async function deleteFile(fileId) {
      if (!isAdmin || !accessToken) return;
      if (!confirm('Are you sure you want to delete this file permanently?')) return;

      try {
        const response = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error ? errData.error.message : 'Failed to delete file');
        }

        alert('File deleted successfully');
        loadGallery();
      } catch (err) {
        alert(`Delete failed: ${err.message}`);
      }
    }
  </script>
</body>
  </html>
